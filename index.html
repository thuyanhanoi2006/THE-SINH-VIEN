<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Thông Tin Sinh Viên</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; padding: 15px; text-align: center; }
    .card { background: white; max-width: 450px; margin: 0 auto; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #2980b9; }
    h2 { margin-top: 0; color: #2980b9; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #3498db; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; color: #333; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:active { background-color: #1c6ea4; transform: scale(0.98); }
    #result-area { display: none; margin-top: 25px; }
    .line-name { font-size: 26px; font-weight: 800; color: #2980b9; text-transform: uppercase; margin-bottom: 5px; line-height: 1.2; }
    .line-dob { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 5px; }
    .line-unit { font-size: 28px; font-weight: 900; color: #d35400; margin-bottom: 20px; letter-spacing: 1px; }
    
    /* Tối ưu lại khung chứa QR để nét hơn */
    #qr-frame { padding: 15px; background-color: white !important; border: 2px solid #000; border-radius: 8px; display: inline-block; }
    #qr-image { width: 250px; height: 250px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
    #qr-image img, #qr-image canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    
    .blink { animation: blinker 2s linear infinite; color: #e74c3c; font-weight: bold; margin-top: 15px; font-size: 14px; }
    @keyframes blinker { 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="card">
    <h2>CỔNG THÔNG TIN SINH VIÊN</h2>
    <input type="text" id="maSVInput" placeholder="Nhập Mã Số..." onkeydown="if(event.key === 'Enter') timKiem()" />
    <button onclick="timKiem()">XEM THẺ</button>
    <div id="loading" style="display:none; margin:15px; color:#2980b9; font-weight:bold;">⚡ Đang tìm siêu tốc...</div>
    <div id="error-msg" style="color:red; font-weight:bold; margin-top:10px;"></div>
    
    <div id="result-area">
      <div id="resName" class="line-name"></div>
      <div id="resDob" class="line-dob"></div>
      <div id="resUnit" class="line-unit"></div>
      
      <div id="qr-frame">
        <div id="qr-image"></div>
      </div>
      
      <p style="font-family:monospace; font-size:16px; font-weight:bold; margin-top:5px; color:#7f8c8d;">MSV: <span id="code-text"></span></p>
      <div class="blink">⚠️ TĂNG SÁNG MÀN HÌNH ĐỂ QUÉT</div>
    </div>
  </div>

  <script>
    // BẠN NHỚ DÁN LẠI LINK WEB APP CỦA BẠN VÀO ĐÂY NHÉ:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxseVtj2cWTQnW-mfSRQNulVyDRxDFm_EFKE9wtQhz30aQ-Id2rwkpbPHMVmsSzWJ0A/exec"; 

    function timKiem() {
      var ma = document.getElementById("maSVInput").value;
      if(!ma) return alert("Vui lòng nhập mã!");
      
      // XỬ LÝ ĐA CHIỀU: Dù nhập CDD... hay CĐ... thì đều quy về CĐ... để tìm trong Database
      ma = convertVietnameseToCode(ma);
      ma = restoreVietnameseFromCode(ma);
      
      document.getElementById("loading").style.display = "block";
      document.getElementById("result-area").style.display = "none";
      document.getElementById("error-msg").innerText = "";

      fetch(WEB_APP_URL + "?api=tim_sv&msv=" + encodeURIComponent(ma))
        .then(response => response.json())
        .then(data => showResult(data))
        .catch(error => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error-msg").innerText = "Lỗi kết nối mạng hoặc lỗi máy chủ!";
        });
    }

    function showResult(data) {
      document.getElementById("loading").style.display = "none";
      if (data.success) {
        document.getElementById("resName").innerText = data.hoTen.toUpperCase();
        document.getElementById("resDob").innerText = data.ngaySinh;
        var fullUnit = (data.donViNho || "") + (data.tenDaiDoi || "");
        document.getElementById("resUnit").innerText = fullUnit;
        
        // SỬA: Chuyển đổi mã sang dạng không dấu chuẩn hóa (DD, AA, AW...) để tạo QR sạch
        var cleanCode = convertVietnameseToCode(data.maSV);
        
        document.getElementById("code-text").innerText = cleanCode;
        
        // --- BƯỚC VẼ QR CODE SIÊU TỐC TRỰC TIẾP TRÊN TRÌNH DUYỆT ---
        var qrContainer = document.getElementById("qr-image");
        qrContainer.innerHTML = ""; // Xóa mã QR cũ nếu có
        
        new QRCode(qrContainer, {
          text: cleanCode, // Sử dụng mã đã chuẩn hóa (VD: CDD...)
          width: 500,  // Độ phân giải thực tế của ảnh tạo ra (cao để nét)
          height: 500,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.L // Mức sửa lỗi thấp nhất để mã QR đơn giản nhất có thể
        });
        // -------------------------------------------------------------

        document.getElementById("result-area").style.display = "block";
      } else {
        document.getElementById("error-msg").innerText = data.message;
      }
    }

    // ==========================================================
    // HÀM CHUYÊN GIA: CHUẨN HÓA MÃ TIẾNG VIỆT SANG KHÔNG DẤU
    // ==========================================================
    function convertVietnameseToCode(str) {
      if (!str) return "";
      str = String(str).trim().toUpperCase();
      
      // Bước 1: Đưa về dạng tổ hợp (NFC) để xử lý các ký tự đặc biệt
      str = str.normalize("NFC");
      
      // Bước 2: Thay thế các ký tự có dấu đặc trưng theo quy ước
      // Đ -> DD
      str = str.replace(/[Đ]/g, "DD");
      
      // Â, Ấ, Ầ... -> AA
      str = str.replace(/[ÂẤẦẨẪẬ]/g, "AA");
      
      // Ă, Ắ, Ằ... -> AW
      str = str.replace(/[ĂẮẰẲẴẶ]/g, "AW");
      
      // Ô, Ố, Ồ... -> OO
      str = str.replace(/[ÔỐỒỔỖỘ]/g, "OO");
      
      // Ê, Ế, Ề... -> EE
      str = str.replace(/[ÊẾỀỂỄỆ]/g, "EE");
      
      // Ơ, Ớ, Ờ... -> OW
      str = str.replace(/[ƠỚỜỞỠỢ]/g, "OW");
      
      // Ư, Ứ, Ừ... -> UW
      str = str.replace(/[ƯỨỪỬỮỰ]/g, "UW");
      
      // Bước 3: Loại bỏ các dấu thanh còn lại (sắc, huyền, hỏi, ngã, nặng)
      // Ví dụ: Á -> A, É -> E, Í -> I...
      str = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      
      return str;
    }

    // ==========================================================
    // HÀM DỊCH NGƯỢC: TỪ MÃ KHÔNG DẤU (CDD) -> VỀ MÃ GỐC (CĐ)
    // ==========================================================
    function restoreVietnameseFromCode(str) {
      if (!str) return "";
      str = String(str).trim().toUpperCase();
      // Quy ước dịch ngược lại để khớp với Database
      str = str.replace(/DD/g, "Đ");
      str = str.replace(/AA/g, "Â");
      str = str.replace(/AW/g, "Ă");
      str = str.replace(/OO/g, "Ô");
      str = str.replace(/EE/g, "Ê");
      str = str.replace(/OW/g, "Ơ");
      str = str.replace(/UW/g, "Ư");
      return str;
    }
  </script>
</body>
</html>
